name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. v1.0.0"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" --target "${{ github.sha }}" --title "${{ inputs.tag }}" --notes "Single-Centred Black Holes in the Composite CHL Models Have Positive Index: LaTeX source, figures and verification code."
